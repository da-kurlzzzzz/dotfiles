input type:touchpad {
    tap enabled
    natural_scroll enabled
    drag_lock disable
    events disabled
}

bindsym --to-code $mod+F4 input type:touchpad events toggle enabled disabled

input type:keyboard {
    xkb_layout $my_xkb_layout
    xkb_options $my_xkb_options
# tmux does not accept default delay so i made it smaller
    repeat_delay 490
}
